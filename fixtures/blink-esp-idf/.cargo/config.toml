# ESP-IDF (std) targets. `just blink-idf <chip>` picks the triple, sets `MCU` and
# passes `-Zbuild-std=std,panic_abort`.

[target.xtensa-esp32-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[env]
# The family's v6.1 wave (rustyfarian-network docs/features/esp-idf-v6-1-upgrade-v1.md).
# v5.3.3's esp-clang 16 needs libxml2.so.2, which Ubuntu 26 (ubuntu-latest) no longer ships.
ESP_IDF_VERSION = "v6.1"
# Tools and the IDF checkout live in ~/.espressif, which CI caches per IDF version and chip.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
# Resolved by embuild relative to this fixture's workspace root.
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults"
