[package]
name = "blink-esp-idf"
version = "0.1.0"
publish = false
description = "Smoke fixture: blink one LED on ESP-IDF std (ESP32, S3, C3, C6)"
authors = ["Florian Waibel <fwaibel@datenkollektiv.de>"]
edition = "2021"
license = "MIT"
rust-version = "1.95"

[[bin]]
name = "blink-esp-idf"
path = "src/main.rs"
# No test harness on the device target.
harness = false
test = false
bench = false

[dependencies]
blink = { path = "../blink" }
# Family pins (rustyfarian-knob, ADR 012), held exactly by the committed Cargo.lock.
# esp-idf-sys is a `links` crate; Dependabot bumps the esp-idf stack as one group.
# Never enable a `defmt` feature here: orphan `.defmt.*` sections break the ESP-IDF v5.3 link.
esp-idf-hal = "0.47"
esp-idf-sys = { version = "0.38", features = ["binstart"] }

[build-dependencies]
embuild = { version = "0.33.5", features = ["espidf"] }

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
