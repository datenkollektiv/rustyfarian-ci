[graph]
# The root workspace is host-only (fixtures/blink); the firmware fixtures are separate
# workspaces with their own Cargo.lock and are never resolved here.
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# The fixtures are `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
